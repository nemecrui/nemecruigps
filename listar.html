<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipamentos Registados</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #222;
        }

        /* Header estilo Cachapuz */
        .header {
            background-color: #1e1e1e;
            color: white;
            padding: 18px 25px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 3px solid #d40000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
        }

        .header span {
            color: #d40000;
        }

        /* Botão voltar */
        .btn-back {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: transparent;
            color: #d40000;
            border: 2px solid #d40000;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.25s;
            z-index: 9999;
        }
        
        .btn-back:hover {
            background-color: #d40000;
            color: white;
        }

        /* Mapa ajustado para não esmagar o rodapé */
        #map {
            height: calc(100vh - 140px);
            width: 100%;
        }

        /* Rodapé */
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            color: #555;
            opacity: 0.85;
            background: #f2f2f2;
            border-top: 1px solid #ddd;
        }

        .footer span {
            color: #d40000;
            font-weight: bold;
        }

        .popup-card {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            padding: 5px;
            width: 220px;
        }
        
        .popup-title {
            font-size: 17px;
            font-weight: 700;
            color: #d40000;
            margin-bottom: 6px;
        }
        
        .popup-info {
            font-size: 13px;
            color: #444;
            margin-bottom: 8px;
        }
        
        .popup-sep {
            border: none;
            border-top: 1px solid #ddd;
            margin: 8px 0;
        }
        
        .popup-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #d40000;
            color: white;
            padding: 8px 10px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            transition: 0.25s;
        }
        
        .popup-btn:hover {
            background: #b30000;
        }
        
        .popup-icon {
            font-size: 16px;
        }

    </style>
</head>

<body>

    <div class="header">
        Equipamentos Registados
    </div>

    <button class="btn-back" onclick="window.location.href='index.html'">
        Voltar
    </button>

    <div id="map"></div>

    <div class="footer">
        created with passion by <span>Nemecrui</span>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="listar.js"></script>

</body>
</html>
