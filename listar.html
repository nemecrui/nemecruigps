<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Equipamentos Registados</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        .header {
            background-color: #1e1e1e;
            color: white;
            padding: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        #map {
            height: 100vh;
            width: 100%;
        }

        .btn-back {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 9999;
            padding: 10px 15px;
            background: #1e1e1e;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="header">Equipamentos Registados</div>

    <button class="btn-back" onclick="window.location.href='index.html'">
        Voltar
    </button>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="listar.js"></script>

</body>
</html>
