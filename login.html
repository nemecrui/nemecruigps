<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login • RuiX</title>

    <style>
        body {
            font-family: "Segoe UI", Roboto, Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            color: #222;
            overflow-x: hidden;
        }

        /* Header estilo Cachapuz */
        .header {
            background-color: #1e1e1e;
            color: white;
            padding: 18px 25px;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 0.5px;
            border-bottom: 3px solid #d40000;
            box-shadow: 0 2px 6px rgba(0,0,0,0.35);
            text-align: center;
        }

        .header span {
            color: #d40000;
        }

        /* Caixa de login com animação */
        .login-box {
            max-width: 380px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.15);
            border: 1px solid #ddd;

            /* ANIMAÇÃO */
            opacity: 0;
            transform: translateY(40px);
            animation: fadeIn 0.8s ease forwards;
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: 600;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #d40000;
            box-shadow: 0 0 6px rgba(212,0,0,0.4);
        }

        /* Botão mostrar password */
        .password-wrapper {
            position: relative;
        }

        .toggle-pass {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            font-size: 18px;
            color: #666;
        }

        /* Botão Login — Cachapuz Clean Red */
        .btn {
            margin-top: 20px;
            padding: 12px 20px;
            background-color: #d40000;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            transition: 0.25s;
        }

        .btn:hover {
            background-color: #b30000;
        }

        .btn.login-anim {
            animation: pulseLogin 0.35s ease-out;
        }
        
        @keyframes pulseLogin {
            0% {
                transform: scale(1);
                background-color: #d40000;
            }
            40% {
                transform: scale(1.07);
                background-color: #e31a1a;
            }
            100% {
                transform: scale(1);
                background-color: #d40000;
            }
        }

        .shake {
                animation: shakeAnim 0.35s ease;
            }
            
            @keyframes shakeAnim {
                0% { transform: translateX(0); }
                20% { transform: translateX(-6px); }
                40% { transform: translateX(6px); }
                60% { transform: translateX(-4px); }
                80% { transform: translateX(4px); }
                100% { transform: translateX(0); }
            }



        /* Mensagem de erro */
        .erro {
            margin-top: 15px;
            color: #d40000;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        /* Rodapé */
        .footer {
            text-align: center;
            padding: 12px;
            font-size: 14px;
            color: #555;
            opacity: 0.85;
            margin-top: 40px;
        }

        .footer span {
            color: #d40000;
            font-weight: bold;
        }

        .welcome {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            color: #d40000;
            padding: 10px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.6s ease, transform 0.6s ease;
            z-index: 9999;
        }
        .welcome.show {
            opacity: 1;
            transform: translateX(-50%) translateY(5px);
        }

    </style>
</head>

<body>

    <div class="header">
        Login
    </div>

    <div id="welcomeMsg" class="welcome"></div>

    <div class="login-box">
        <label>Utilizador</label>
        <input type="text" id="user">

        <label>Password</label>
        <div class="password-wrapper">
            <input type="password" id="pass">
            <span class="toggle-pass" onclick="togglePassword()">👁️</span>
        </div>

        <button class="btn" onclick="login()">Login</button>

        <div class="erro" id="erroMsg">Utilizador ou password incorretos</div>
    </div>

    <div class="footer">
        created with passion by <span>Nemecrui</span>
    </div>

    <script>
        function escreverTexto(elemento, texto, velocidade = 35) {
            elemento.textContent = "";
            let i = 0;
        
            function escrever() {
                if (i < texto.length) {
        
                    // escrever letra
                    elemento.textContent += texto.charAt(i);
        
                    // tocar som de teclar
                    const som = document.getElementById("typeSound");
                    som.currentTime = 0;
                    som.play();
        
                    i++;
                    setTimeout(escrever, velocidade);
                }
            }
        
            escrever();
        }


        function login() {
            const u = document.getElementById("user").value.trim();
            const p = document.getElementById("pass").value.trim();
            const erro = document.getElementById("erroMsg");
            const msg = document.getElementById("welcomeMsg");
    
            const frases = [
                "Bem-vindo ao Mundo do RuiX",
                "RuiX entrou no edifício",
                "Sistema armado. RuiX online.",
                "A lenda voltou.",
                "RuiX detected. A abrir portas...",
                "Carregando genialidade...",
                "O mestre chegou.",
                "RuiX: 1 • Problemas: 0"
            ];
    
            if (u === "Rui" && p === "RuiX") {
                    erro.style.display = "none";
                
                    // animação do botão
                    const btn = document.querySelector(".btn");
                    btn.classList.add("login-anim");
                
                    // som whoosh
                    document.getElementById("loginSound").play();
                
                    // escolher frase aleatória
                    const frase = frases[Math.floor(Math.random() * frases.length)];
                
                    // mostrar toast
                    msg.classList.add("show");
                
                    // escrever letra a letra
                    escreverTexto(msg, frase);
                
                    // remover animação do botão
                    setTimeout(() => {
                        btn.classList.remove("login-anim");
                    }, 400);
                
                    // desaparecer e redirecionar
                    setTimeout(() => {
                        msg.classList.remove("show");
                        window.location.href = "index.html";
                    }, 2600);
                }
             else {
                    erro.style.display = "block";
                
                    const box = document.querySelector(".login-box");
                    box.classList.add("shake");
                
                    setTimeout(() => {
                        box.classList.remove("shake");
                    }, 400);
                }

        }
    
        function togglePassword() {
            const pass = document.getElementById("pass");
            const icon = document.querySelector(".toggle-pass");
    
            if (pass.type === "password") {
                pass.type = "text";
                icon.textContent = "🙈";
            } else {
                pass.type = "password";
                icon.textContent = "👁️";
            }
        }
    </script>


    <audio id="loginSound" src="whoosh.mp3" preload="auto"></audio>
    <audio id="typeSound" src="typewriter.mp3" preload="auto"></audio>


</body>
</html>
